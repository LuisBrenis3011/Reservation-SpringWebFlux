spring.application.name=eats_hub_catalog
spring.webflux.base-path=/catalog
spring.config.import=optional:file:.env[.properties]

#spring.data.mongodb.auto-index-creation=true

# Evitar documentos y parámetros de reservas en logs de consultas.
logging.level.org.springframework.data.mongodb=INFO

# Preparación T002: no habilitar antes de completar seguridad y coordinación.
availability.enabled=${AVAILABILITY_ENABLED:false}
availability.issuer-uri=${AVAILABILITY_ISSUER_URI:}
availability.jwk-set-uri=${AVAILABILITY_JWK_SET_URI:}
availability.audience=${AVAILABILITY_AUDIENCE:eats-hub-catalog}
availability.commitment-check-timeout=${AVAILABILITY_COMMITMENT_CHECK_TIMEOUT:3s}
availability.transaction-timeout=${AVAILABILITY_TRANSACTION_TIMEOUT:5s}
availability.max-transaction-attempts=${AVAILABILITY_MAX_TRANSACTION_ATTEMPTS:3}
availability.first-retry-backoff=${AVAILABILITY_FIRST_RETRY_BACKOFF:50ms}
availability.second-retry-backoff=${AVAILABILITY_SECOND_RETRY_BACKOFF:100ms}
reservations.enabled=${RESERVATIONS_ENABLED:false}
