mongodb.host=${MONGODB_HOST:localhost}
mongodb.port=${MONGODB_PORT:27017}
mongodb.username=${MONGODB_USERNAME:master}
mongodb.password=${MONGODB_PASSWORD}
mongodb.database=${MONGODB_DATABASE:catalog}
mongodb.authentication-database=${MONGODB_AUTH_DATABASE:admin}
# MongoConfig utiliza esta URI si está definida; en otro caso usa host/port/credenciales.
# URI completa con replicaSet y authSource; no cambiar .env antes de migrar/verificar.
mongodb.uri=${MONGODB_URI:}

mongodb.maxPoolSize=100
mongodb.minPoolSize=10
mongodb.maxConnectionLifeTime=60000
